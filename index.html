<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UPSC Prelims 2027 Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--card:#fff;--tx:#1d1b18;--mu:#6b665f;--bd:#e6e1d9;--ac:#b4532a;--ok:#2f7d4f;--bar:#eadfd3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211f1c;--tx:#f0ece6;--mu:#a39d94;--bd:#37332e;--ac:#e08a5e;--ok:#6cc28b;--bar:#3a342e}}
:root[data-theme="dark"]{--bg:#171513;--card:#211f1c;--tx:#f0ece6;--mu:#a39d94;--bd:#37332e;--ac:#e08a5e;--ok:#6cc28b;--bar:#3a342e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1280px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.big{font-size:34px;font-weight:700;color:var(--ac);line-height:1}
.bar{height:8px;background:var(--bar);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}.bar i.ok{background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 4px;font:inherit;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
input,select,textarea,button{font:inherit;color:var(--tx)}
input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px;width:100%}
input[type=number]{width:80px;text-align:center}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}.btn.g{background:none;border:1px solid var(--bd);color:var(--tx)}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0}.chk input{width:18px;height:18px;accent-color:var(--ac)}
.bars{display:flex;gap:4px;align-items:flex-end;height:70px}.bars div{flex:1;background:var(--bar);border-radius:3px 3px 0 0;min-height:2px}.bars div.ok{background:var(--ok)}
details{padding:0}summary{cursor:pointer;font-weight:600}
.t{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:5px 0;font-size:14px}.t label{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mu)}.t input{width:18px;height:18px;accent-color:var(--ac)}
.pill{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scroll{overflow-x:auto}
h1{font-size:22px}h2{font-size:17px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#acct{margin:12px 0}
#app{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px;align-items:start}
.wide{grid-column:1/-1}
.hero{background:linear-gradient(135deg,var(--card),var(--bar))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mg>div{border:1px solid var(--bd);border-radius:10px;padding:12px}
.bars{height:90px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}.big{font-size:28px}}
@media(min-width:900px){nav{position:static;border:0;background:none;padding:0;width:auto}nav button{flex:none;padding:8px 18px;border-radius:8px;font-size:14px}nav button.on{background:var(--bar)}main{padding:20px 28px 40px}}
</style></head><body><main>
<header class="top"><h1>🎯 UPSC Prelims 2027</h1><nav><button data-t="today">Today</button><button data-t="syl">Syllabus</button><button data-t="plan">Plan</button><button data-t="mock">Mocks</button></nav><button class="btn g" id="th">Theme</button></header>
<div class="mu">Tracker for the 23 May 2027 attempt. GS Paper I (200) + CSAT (qualifying, 33%). Confirm the syllabus against the official notification (due 13 Jan 2027, upsc.gov.in).</div>
<div id="acct" class="card"></div><div id="app"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),K='upsc27';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{};S.days=S.days||{};S.t=S.t||{};S.mocks=S.mocks||[];
const save=()=>{S.u=new Date().toISOString();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}queue()};
const pad=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dk(new Date());
const P=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const EXAM='2027-05-23',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SUB=[
{id:'pol',w:1,n:'Polity & Governance',s:'2026-11-09',e:'2026-12-06',t:['Constitution: making, Preamble, features, amendments','Fundamental Rights, DPSP, Fundamental Duties','Union Executive & Parliament','States, Judiciary, tribunals','Federalism, Centre–State relations, Panchayati Raj & local govt','Constitutional & statutory bodies','Elections, RP Act, political system','Public policy, governance, rights issues','Landmark judgments & recent amendments']},
{id:'his',w:1,n:'History & Culture',s:'2026-12-07',e:'2027-01-10',t:['Ancient India: Indus to Guptas','Medieval India: Delhi Sultanate to Mughals, regional kingdoms','Art, architecture, literature, music, dance','Advent of Europeans, British expansion','1857 revolt, socio-religious reforms','Freedom struggle 1885–1947 (phases, leaders, movements)','Post-independence consolidation']},
{id:'eco',w:1,n:'Economy & Social Development',s:'2027-01-11',e:'2027-01-31',t:['National income, growth, planning basics','Money, banking, RBI, inflation','Budget, fiscal policy, taxation','External sector, trade, BoP','Agriculture & food security','Industry, infrastructure, services','Poverty, inclusion, demographics, social sector schemes','Sustainable development','Economic Survey & Union Budget']},
{id:'geo',w:1,n:'Geography (India & World)',s:'2027-02-01',e:'2027-02-21',t:['Geomorphology & climatology','Oceanography','India: physiography, drainage, climate','Soils, vegetation, agriculture geography','Resources, minerals, industries','Population, urbanisation, human geography','World geography, maps, places in news']},
{id:'env',w:1,n:'Environment, Ecology & Climate Change',s:'2027-02-22',e:'2027-03-02',t:['Ecology basics, ecosystems','Biodiversity, protected areas, species in news','Climate change & international conventions','Pollution, EIA, environmental laws']},
{id:'sci',w:1,n:'General Science & Tech',s:'2027-03-03',e:'2027-03-07',t:['Physics & chemistry basics','Biology, health, diseases','Space, defence, nuclear','IT, AI, biotech, emerging tech']},
{id:'ca',n:'Current Events (daily habit)',t:['Daily newspaper + notes','Monthly current affairs compilation','International relations & organisations','Schemes, reports, indices']},
{id:'cs',n:'CSAT Paper II (qualifying)',t:['Reading comprehension','Logical reasoning & analytical ability','Decision-making & problem solving','Basic numeracy & data interpretation (Class X)','General mental ability','Interpersonal skills & communication']}];
const ALL=SUB.flatMap(s=>s.t.map((n,i)=>({id:s.id+i,sub:s,n})));
const PH=[['Phase 1 · Build the base','2026-11-09','2027-03-07','First pass of every subject, daily current affairs, weekly topic tests.',[4,1.5,1.5,1,1]],['Phase 2 · Revise & practise','2027-03-08','2027-04-18','Revision 1, PYQs by topic, sectional tests, 1–2 full mocks a week.',[2.5,1.5,2.5,2,1]],['Phase 3 · Mock sprint','2027-04-19','2027-05-22','Full mocks every other day, analyse errors, Revision 2, no new sources.',[1,1.5,3.5,3,1]]];
const CATS=[['st','Static study'],['ca','Current affairs'],['mcq','MCQs / PYQs / mocks'],['rv','Revision'],['cs','CSAT']];
const CHK=['Newspaper read + notes made','Yesterday’s MCQs reviewed','Gym done','Revision slot done','Slept 7h+'];
const MON=[['2026-11','Nov 2026','Polity first pass; build the daily CA habit.',0],['2026-12','Dec 2026','Polity revision; History & Culture (ancient to modern).',0],['2027-01','Jan 2027','Finish History; Economy first pass. Fill the form 13 Jan–2 Feb.',2],['2027-02','Feb 2027','Geography; Environment starts; first full mocks.',3],['2027-03','Mar 2027','Environment + Sci&Tech; Phase 2 begins 8 Mar.',6],['2027-04','Apr 2027','PYQs, sectional tests, Revision 1; Phase 3 from 19 Apr.',10],['2027-05','May 2027','Mock sprint, Revision 2, rest before 23 May.',12]];
let cur=today(),tab='today',open={};
const day=k=>S.days[k]||(S.days[k]={h:{},c:{},n:''});
const hrs=k=>{const d=S.days[k];return d?CATS.reduce((a,c)=>a+(+d.h[c[0]]||0),0):0};
const phase=k=>PH.find(p=>k<=p[2])||PH[2];
const dn=(a,b)=>diff(a,b)+1;
const pct=(a,b)=>b?Math.round(100*a/b):0;
const bar=(v,c)=>`<div class="bar"><i class="${c||''}" style="width:${Math.min(100,v)}%"></i></div>`;
function curSub(){const t=today(),w=SUB.filter(s=>s.w);return w.find(s=>t>=s.s&&t<=s.e)||(t<w[0].s?w[0]:null)}
function streak(){let n=0,d=new Date();if(hrs(dk(d))<8)d.setDate(d.getDate()-1);while(hrs(dk(d))>=8){n++;d.setDate(d.getDate()-1)}return n}
function vToday(){
const t=today(),left=diff(t,EXAM),ph=phase(cur),d=day(cur),tot=hrs(cur),cs=curSub();
const dc=ALL.filter(x=>S.t[x.id]&&S.t[x.id].d).length;
let h=`<div class="card wide hero"><div class="stats"><div><div class="big">${left}</div><div class="mu">days to Prelims · ${(left/7).toFixed(1)} weeks</div></div><div><div class="big">${tot}h</div><div class="mu">logged ${cur===t?'today':cur}</div></div><div><div class="big">${streak()}</div><div class="mu">day streak (8h+)</div></div><div><div class="big">${pct(dc,ALL.length)}%</div><div class="mu">syllabus first pass</div></div></div><div style="margin-top:14px"><b>${ph[0]}</b> <span class="mu">${ph[3]}</span></div></div>`;
h+=`<div class="card"><div class="row"><h2>Daily log</h2><input type="date" id="dt" value="${cur}" style="width:auto"></div><div class="mu">Targets for this phase (hours). Aim for 8–10 total, gym sits outside this.</div>`;
CATS.forEach((c,i)=>{h+=`<div class="row" style="padding:6px 0"><span>${c[1]} <span class="pill">target ${ph[4][i]}h</span></span><input type="number" step="0.5" min="0" max="14" data-h="${c[0]}" value="${d.h[c[0]]||''}" placeholder="0"></div>`});
h+=`<div class="row" style="margin-top:6px"><b>Total ${tot}h</b><span class="mu">${tot>=8?'Target hit ✓':'Need '+(8-tot).toFixed(1)+'h more for 8h'}</span></div>${bar(pct(tot,10),tot>=8?'ok':'')}`;
h+=`<div style="margin-top:10px">`+CHK.map((x,i)=>`<label class="chk"><input type="checkbox" data-c="${i}" ${d.c[i]?'checked':''}>${x}</label>`).join('')+`</div><textarea data-n rows="2" placeholder="Notes: what I covered, what to fix tomorrow" style="margin-top:8px">${esc(d.n||'')}</textarea></div>`;
if(cs){const pend=ALL.filter(x=>x.sub===cs&&!(S.t[x.id]&&S.t[x.id].d)),dl=Math.max(0,diff(t,cs.e)+1);
h+=`<div class="card"><h2>Current block: ${cs.n}</h2><div class="mu">${cs.s} to ${cs.e} · ${pend.length} topics left · ${dl} days left in block${pend.length&&dl?' · about '+(pend.length/dl).toFixed(1)+' topics/day':''}${pend.length&&!dl?' · behind schedule, carry forward':''}</div><ul>`+(pend.slice(0,3).map(x=>`<li>${x.n}</li>`).join('')||'<li>Block complete. Move to revision and MCQs.</li>')+`</ul></div>`}
const b=[];for(let i=13;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const k=dk(x),v=hrs(k);b.push(`<div class="${v>=8?'ok':''}" style="height:${Math.max(2,v/10*70)}px" title="${k}: ${v}h"></div>`)}
let wk=0;for(let i=0;i<7;i++){const x=new Date();x.setDate(x.getDate()-i);wk+=hrs(dk(x))}
return h+`<div class="card wide"><div class="row"><h2>Last 14 days</h2><span class="mu">Streak (8h+): ${streak()} · 7-day total ${wk}h</span></div><div class="bars">${b.join('')}</div></div>`}
function vSyl(){
const dn_=ALL.filter(x=>S.t[x.id]&&S.t[x.id].d).length,r1=ALL.filter(x=>S.t[x.id]&&S.t[x.id].r1).length;
let h=`<div class="card wide"><h2>Syllabus progress</h2><div class="mu">First pass ${dn_}/${ALL.length} · Revision 1 ${r1}/${ALL.length}</div>${bar(pct(dn_,ALL.length),'ok')}<div style="height:6px"></div>${bar(pct(r1,ALL.length))}</div>`;
SUB.forEach(s=>{const ts=ALL.filter(x=>x.sub===s),d=ts.filter(x=>S.t[x.id]&&S.t[x.id].d).length;
h+=`<div class="card"><details data-o="${s.id}" ${open[s.id]?'open':''}><summary>${s.n} <span class="pill">${d}/${ts.length}</span>${s.w?` <span class="mu">${s.s.slice(5)} → ${s.e.slice(5)}</span>`:''}<div style="margin:8px 0">${bar(pct(d,ts.length),'ok')}</div></summary>`+ts.map(x=>{const v=S.t[x.id]||{};return `<div class="t"><span>${x.n}</span>${[['d','Done'],['r1','R1'],['r2','R2']].map(f=>`<label>${f[1]}<input type="checkbox" data-tp="${x.id}" data-f="${f[0]}" ${v[f[0]]?'checked':''}></label>`).join('')}</div>`}).join('')+`</details></div>`});
return h}
function vPlan(){
let h=PH.map(p=>`<div class="card"><h2>${p[0]}</h2><div class="mu">${p[1]} to ${p[2]}</div><p>${p[3]}</p><div class="mu">Daily split (h): ${CATS.map((c,i)=>c[1]+' '+p[4][i]).join(' · ')}</div></div>`).join('');
h+=`<div class="card wide"><h2>Monthly targets</h2><div class="mg">`;
MON.forEach(m=>{const f=P(m[0]+'-01'),l=new Date(f.getFullYear(),f.getMonth()+1,0),a=m[0]==='2026-11'?'2026-11-09':dk(f),z=m[0]==='2027-05'?'2027-05-22':dk(l),dd=dn(a,z),ht=dd*8;
let hl=0;for(let i=0;i<dd;i++){const x=P(a);x.setDate(x.getDate()+i);hl+=hrs(dk(x))}
let ex=0;SUB.filter(s=>s.w).forEach(s=>{const o=Math.min(z,s.e)>=Math.max(a,s.s)?dn(Math.max(a,s.s),Math.min(z,s.e)):0;ex+=s.t.length*o/dn(s.s,s.e)});
const td=ALL.filter(x=>S.t[x.id]&&S.t[x.id].d&&S.t[x.id].d.startsWith(m[0])).length,mk=S.mocks.filter(x=>x.d.startsWith(m[0])).length;
h+=`<div><b>${m[1]}</b> <span class="mu">${m[2]}</span><div class="g2" style="margin-top:6px"><div class="mu">Hours ${Math.round(hl)}/${ht}${bar(pct(hl,ht),hl>=ht?'ok':'')}</div><div class="mu">Topics ${td}/${Math.round(ex)}${bar(pct(td,ex))}</div></div><div class="mu" style="margin-top:4px">Mocks/tests logged ${mk} of ${m[3]} planned</div></div>`});
h+=`</div></div><div class="card wide"><h2>Backup</h2><div class="mu">Data lives in this browser only. Copy this text to back up; paste a saved copy below and press Restore to move to another device.</div><textarea id="ex" rows="3">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:8px"><span class="mu">Paste replaces everything</span><button class="btn g" id="im">Restore from text</button></div></div>`;
return h}
const sc=m=>{const cs=m.t==='CSAT',q=cs?2.5:2,n=cs?2.5/3:2/3;return Math.round((m.c*q-m.w*n)*10)/10};
function vMock(){
const g=S.mocks.filter(m=>m.t!=='CSAT').slice(-5),av=g.length?Math.round(g.reduce((a,m)=>a+sc(m),0)/g.length):0;
let h=`<div class="card"><h2>Log a mock / test</h2><div class="g2"><input type="date" id="md" value="${today()}"><select id="mt"><option>Full GS mock</option><option>CSAT</option><option>Sectional</option><option>PYQ paper</option></select></div><div class="g2" style="margin-top:8px"><input type="number" id="mc" placeholder="Correct" style="width:100%"><input type="number" id="mw" placeholder="Wrong" style="width:100%"></div><input id="mn" placeholder="Weak areas / lesson" style="margin-top:8px;width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 8px"><div class="row" style="margin-top:8px"><span class="mu">GS: +2 / −⅔. CSAT: +2.5 / −0.83, qualify at 66/200.</span><button class="btn" id="ma">Add</button></div></div>`;
h+=`<div class="card"><div class="row"><h2>Scores</h2><span class="mu">Avg of last 5 GS-type: ${av}/200 · suggested goal 120+ by April (my target, not official)</span></div>`;
h+=S.mocks.slice().reverse().map((m,i)=>{const r=S.mocks.length-1-i,s=sc(m),a=m.c+m.w?Math.round(100*m.c/(m.c+m.w)):0;return `<div style="border-top:1px solid var(--bd);padding:8px 0"><div class="row"><b>${m.d} · ${esc(m.t)}</b><span><b>${s}</b>/200 · acc ${a}% <button class="btn g" data-del="${r}" style="padding:2px 8px">×</button></span></div>${bar(s/2,m.t==='CSAT'?(s>=66?'ok':''):(s>=120?'ok':''))}<div class="mu">${m.c} correct, ${m.w} wrong${m.n?' · '+esc(m.n):''}</div></div>`}).join('')||'<div class="mu">No tests yet.</div>';
return h+`</div>`}
function render(){$('#app').innerHTML=({today:vToday,syl:vSyl,plan:vPlan,mock:vMock})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
document.addEventListener('click',e=>{const t=e.target;
if(t.closest('nav button')){tab=t.closest('nav button').dataset.t;render();scrollTo(0,0)}
if(t.id==='th'){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
if(t.id==='ma'){const c=+$('#mc').value,w=+$('#mw').value;if(isNaN(c)||isNaN(w)||(!c&&!w))return;S.mocks.push({d:$('#md').value||today(),t:$('#mt').value==='CSAT'?'CSAT':$('#mt').value,c,w,n:$('#mn').value});S.mocks.sort((a,b)=>a.d<b.d?-1:1);save();render()}
if(t.dataset.del){S.mocks.splice(+t.dataset.del,1);save();render()}
if(t.id==='im'){try{const o=JSON.parse($('#ex').value);if(o&&o.days&&o.t&&o.mocks){S=o;save();render()}}catch(x){alert('That text is not valid backup data.')}}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(t.id==='dt'){cur=t.value||today();render()}
else if(d.h){day(cur).h[d.h]=t.value===''?0:+t.value;save();render()}
else if(d.c){day(cur).c[d.c]=t.checked;save()}
else if('n'in d){day(cur).n=t.value;save()}
else if(d.tp){const v=S.t[d.tp]||(S.t[d.tp]={});if(t.checked)v[d.f]=today();else delete v[d.f];save();render()}});
document.addEventListener('toggle',e=>{const o=e.target.dataset&&e.target.dataset.o;if(o)open[o]=e.target.open},true);
/* ---- Supabase sync: paste your project URL and publishable (anon) key ---- */
const SB_URL='YOUR_SUPABASE_URL',SB_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
let sb=null,user=null,tm,syncMsg='Not signed in';
if(window.supabase&&!SB_URL.startsWith('YOUR_'))sb=supabase.createClient(SB_URL,SB_KEY);
function queue(){if(!sb||!user)return;clearTimeout(tm);tm=setTimeout(push,1200)}
async function push(){const{error}=await sb.from('tracker_state').upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});syncMsg=error?'Sync failed: '+error.message:'Synced '+new Date().toLocaleTimeString();acct()}
async function pull(){const{data,error}=await sb.from('tracker_state').select('data').eq('user_id',user.id).maybeSingle();
if(error){syncMsg='Load failed: '+error.message;acct();return}
const r=data&&data.data;
if(r&&r.days&&(!S.u||(r.u||'')>S.u)){S=r;S.days=S.days||{};S.t=S.t||{};S.mocks=S.mocks||[];try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}syncMsg='Loaded from cloud';render();acct()}
else await push()}
function acct(){const a=$('#acct');
if(!sb){a.innerHTML='<span class="mu">Cloud sync is off. Add your Supabase URL and key near the top of the script.</span>';return}
a.innerHTML=user?`<div class="row"><span class="mu">${esc(user.email)} · ${esc(syncMsg)}</span><button class="btn g" id="so">Sign out</button></div>`:`<div class="g2"><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"></div><div class="row" style="margin-top:8px"><span class="mu">${esc(syncMsg)}</span><span><button class="btn g" id="su">Sign up</button> <button class="btn" id="si">Sign in</button></span></div>`}
document.addEventListener('click',async e=>{const id=e.target.id;if(!sb)return;
if(id==='si'||id==='su'){const email=$('#em').value.trim(),password=$('#pw').value;
const r=id==='si'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
